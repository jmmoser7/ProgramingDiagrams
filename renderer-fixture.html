<!doctype html><html><head><meta charset="utf-8"><title>Studio rendering fixture</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}#controls{position:fixed;left:20px;top:20px;padding:6px 8px;background:#fffffff0;border:1px solid #e1e5e7;border-radius:20px;font-size:12px;color:#656970;display:flex;gap:5px}button{border:0;background:transparent;padding:5px 10px;border-radius:14px;cursor:pointer}button.active{background:#e8eeeb}#mode{padding:5px 10px;color:#92989d}</style></head><body><canvas id="ground"></canvas><canvas id="scene"></canvas><canvas id="labels"></canvas><div id="controls"><button data-material="ceramic">Ceramic</button><button data-material="matte">Matte color</button><button data-material="glossy">Glossy</button><button data-material="jelly">Jelly</button><button data-material="glass">Beach glass</button><button id="stack">Stack</button><button id="rotate">Rotate</button><span id="mode"></span></div><script src="iso-geometry.js"></script><script src="iso-renderer.js"></script><script>
const G=ProgramIsoGeometry,params=new URLSearchParams(location.search),renderer=ProgramIsoRenderer.create({canvas:document.querySelector('#scene'),ground:document.querySelector('#ground'),geometry:G,software:params.has('software')}),labels=document.querySelector('#labels'),ctx=labels.getContext('2d');
const list=[{id:1,name:'Shop',x:0,y:0,w:84,h:84,color:'#48cce9'},{id:2,name:'Team Assembly',x:-55,y:0,w:53,h:53,color:'#ffae80'},{id:3,name:'Storage',x:-27,y:55,w:28,h:28,color:'#68dc97'},{id:4,name:'Assembly / Paint',x:3,y:87,w:29,h:29,color:'#b28bf3'},{id:5,name:'Lounge / Collab',x:34,y:87,w:27,h:27,color:'#f780b8'},{id:6,name:'Welcome',x:65,y:-30,w:23,h:23,color:'#f8dc65'}].map(s=>({...s,height:8,radius:1.75,z:0,material:params.get('material')||'ceramic'}));
let angle=Math.PI/4,selected=new Set(),camera={x:0,y:0,z:0,scale:4},stacked=false;
function fit(){const b=G.axes(angle),p=[];for(const s of list)for(const x of [s.x,s.x+s.w])for(const y of [s.y,s.y+s.h])for(const z of [0,s.z+s.height])p.push([x,y,z]);const xs=p.map(p=>G.dot(p,b.right)),ys=p.map(p=>G.dot(p,b.up)),r=(Math.min(...xs)+Math.max(...xs))/2,u=(Math.min(...ys)+Math.max(...ys))/2;camera.scale=Math.min((innerWidth-140)/(Math.max(...xs)-Math.min(...xs)),(innerHeight-160)/(Math.max(...ys)-Math.min(...ys)));camera.x=b.right[0]*r+b.up[0]*u;camera.y=b.right[1]*r+b.up[1]*u;camera.z=b.up[2]*u;}
function draw(){renderer.resize(innerWidth,innerHeight,devicePixelRatio);labels.width=innerWidth*devicePixelRatio;labels.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);const basis=G.axes(angle);renderer.render({list,camera,basis,width:innerWidth,height:innerHeight,selected,view:{gridStep:10,isoGrid:true}});ctx.fillStyle='#46505bcc';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='15px Segoe UI';for(const s of list){const p=[s.x+s.w/2-camera.x,s.y+s.h/2-camera.y,s.z+s.height-camera.z],x=innerWidth/2+G.dot(p,basis.right)*camera.scale,y=innerHeight/2-G.dot(p,basis.up)*camera.scale;ctx.fillText(s.name,x,y);}document.querySelector('#mode').textContent=renderer.mode;document.querySelectorAll('[data-material]').forEach(b=>b.classList.toggle('active',b.dataset.material===list[0].material));}
document.querySelectorAll('[data-material]').forEach(button=>button.onclick=()=>{list.forEach(s=>s.material=button.dataset.material);draw();});document.querySelector('#rotate').onclick=()=>{angle+=Math.PI/2;fit();draw();};document.querySelector('#stack').onclick=()=>{stacked=!stacked;Object.assign(list[2],stacked?{x:30,y:20,z:8}:{x:-27,y:55,z:0});fit();draw();};onresize=()=>{fit();draw();};fit();draw();
</script></body></html>
